<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập CCNA</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7385;--line:#e4e7ec;
  --accent:#2563eb;--accent-soft:#e8efff;--ok:#16a34a;--ok-soft:#e7f7ec;--bad:#dc2626;--bad-soft:#fdecec;
  --vi:#0f766e;--code:#f1f3f6;--warn:#b45309;--warn-soft:#fef3e2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1218;--card:#171b23;--text:#e6e9ef;--muted:#8d95a6;--line:#262c37;
  --accent:#5b8cff;--accent-soft:#1c2740;--ok:#3ccf74;--ok-soft:#14281c;--bad:#ff6b6b;--bad-soft:#2f1717;
  --vi:#4fd1c5;--code:#11151c;--warn:#fbbf24;--warn-soft:#2d2410;}}
:root[data-theme=dark]{
  --bg:#0f1218;--card:#171b23;--text:#e6e9ef;--muted:#8d95a6;--line:#262c37;
  --accent:#5b8cff;--accent-soft:#1c2740;--ok:#3ccf74;--ok-soft:#14281c;--bad:#ff6b6b;--bad-soft:#2f1717;
  --vi:#4fd1c5;--code:#11151c;--warn:#fbbf24;--warn-soft:#2d2410;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header h1{font-size:19px;margin:0;font-weight:650;cursor:pointer}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
h2{font-size:15px;margin:26px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sec{text-align:left;display:block;width:100%}
.sec b{display:block;font-size:15px;margin-bottom:4px}
.sec small{color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips .btn{padding:5px 10px;font-size:14px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.qhead .sp{flex:1}
.stem p{margin:0 0 8px;white-space:pre-wrap}
.stem img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin:6px 0;background:#fff}
.vi{color:var(--vi)}
.stem .vi{font-size:14.5px}
pre,.tbl td{font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.tbl{border-collapse:collapse;margin:8px 0;width:100%}
.tbl td{border:1px solid var(--line);padding:8px;vertical-align:top;background:var(--code)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:flex;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.opt .t{flex:1;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.opt .t .vi{display:block;font-size:14px;margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.code .t{font:13px/1.5 ui-monospace,Consolas,monospace}
.verdict{margin-top:14px;padding:10px 12px;border-radius:8px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict .ex{font-weight:400;color:var(--text);white-space:pre-wrap;margin-top:6px}
.nav{display:flex;gap:8px;margin-top:16px;align-items:center}
.nav .sp{flex:1}
.prog{height:4px;background:var(--line);border-radius:2px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px}
.dots button{width:30px;height:26px;font-size:11px;border-radius:5px;border:1px solid var(--line);background:var(--card);padding:0}
.dots button.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.dots button.ok{background:var(--ok-soft);border-color:var(--ok)}
.dots button.bad{background:var(--bad-soft);border-color:var(--bad)}
.explain{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);border-left:3px solid var(--accent);font-size:14.5px;white-space:pre-wrap}
.explain b{display:block;margin-bottom:4px;color:var(--accent)}
.explain .warn{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
details.exd{margin-top:12px}
details.exd summary{cursor:pointer;color:var(--accent);font-size:14px}
code{font:13px ui-monospace,Consolas,monospace;background:var(--code);padding:1px 4px;border-radius:4px}
.sbox{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;outline:none}
.sbox:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.res{margin-top:12px}
.res .ans{margin-top:10px;font-weight:600;color:var(--ok)}
mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme=dark] mark{background:#665214}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) mark{background:#665214}}
@media (max-width:560px){header h1{font-size:16px}header{gap:6px}header .btn{padding:6px 9px;font-size:14px}}
.big{font-size:40px;font-weight:700;margin:4px 0}
.muted{color:var(--muted)}
.kbd{font-size:12px;color:var(--muted);margin-top:22px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--vi);border-radius:50%;animation:s 0.7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:560px){.wrap{padding:14px 16px 60px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home">📘 Ôn tập CCNA</h1>
    <span class="sp"></span>
    <button class="btn" id="searchBtn" title="Tìm câu hỏi (phím /)">🔍 Tìm câu</button>
    <button class="btn" id="trBtn" title="Dịch sang tiếng Việt (phím T)">🌐 Dịch: Tắt</button>
    <button class="btn" id="themeBtn" title="Đổi giao diện sáng/tối">◐</button>
  </header>
  <main id="app"></main>
</div>
<script src="data.js"></script>
<script src="explain.js"></script>
<script>
(() => {
const DATA = window.CCNA_DATA;
const ALL = DATA.flatMap(s => s.questions.map(q => ({...q, sec: s.id, secTitle: s.title})));
const BY_ID = Object.fromEntries(ALL.map(q => [q.id, q]));
const EXPLAIN = window.CCNA_EXPLAIN || {};
const LETTERS = 'ABCDEFGH';
// Options like "Option A" point at exhibit tables/images, so their order must stay fixed.
const canShuffle = q => !q.options.some(o => /^Option [A-H]/i.test(o.text.trim()));
const $ = s => document.querySelector(s);
const app = $('#app');

// ---------- storage (safe) ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem('ccna:'+k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('ccna:'+k, JSON.stringify(v)); } catch {} }
};
let stats = store.get('stats', {});        // id -> {c: correct count, w: wrong count, last: 1|0}
let trOn = store.get('tr', false);
let trCache = store.get('trCache', {});
const saveStats = () => store.set('stats', stats);

// ---------- theme ----------
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get('theme', null));
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; applyTheme(t); store.set('theme', t);
};

// ---------- translation (Google Translate public endpoint, cached) ----------
const isCode = s => /(\(config[^)]*\)#|^\s*[\w-]+#|^\s*(interface|ip |ipv6 |switchport|router |no |access-list|line |enable |username |crypto |spanning-tree|channel-group|vlan )|\d+\.\d+\.\d+\.\d+\/\d+$)/m.test(s) && !/\b(the|is|which|what|to|of)\b/i.test(s.split('\n')[0]);
const shouldTr = s => s && /[a-z]{3,}/i.test(s) && !isCode(s) && !/^(Option [A-H]|Refer to the exhibit\.?)$/i.test(s.trim());
const pending = {};
let trSaveTimer;
function translate(text){
  text = text.trim();
  if (trCache[text]) return Promise.resolve(trCache[text]);
  if (pending[text]) return pending[text];
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(text);
  return pending[text] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => {
      const out = j[0].map(x => x[0]).join('');
      trCache[text] = out; delete pending[text];
      clearTimeout(trSaveTimer); trSaveTimer = setTimeout(() => store.set('trCache', trCache), 800);
      return out;
    }).catch(e => { delete pending[text]; throw e; });
}
function fillTranslations(root){
  if (!trOn) return;
  root.querySelectorAll('[data-tr]').forEach(el => {
    const src = el.dataset.tr;
    if (trCache[src.trim()]) { el.textContent = trCache[src.trim()]; return; }
    el.innerHTML = '<span class="spin"></span>';
    translate(src).then(t => { el.textContent = t; })
      .catch(() => { el.textContent = '(Không dịch được — kiểm tra kết nối mạng)'; el.classList.add('muted'); });
  });
}
const trBtnSync = () => { $('#trBtn').textContent = '🌐 Dịch: ' + (trOn ? 'Bật' : 'Tắt'); $('#trBtn').classList.toggle('on', trOn); };
trBtnSync();
$('#trBtn').onclick = () => { trOn = !trOn; store.set('tr', trOn); trBtnSync(); if (session) renderQ(); else if (search) renderResults(); };

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const viSpan = (text, tag='span') => trOn && shouldTr(text) ? `<${tag} class="vi" data-tr="${esc(text.trim())}"></${tag}>` : '';
const need = q => q.answer.length || 1;
const fmtEx = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');

// ---------- home ----------
let session = null;
let homeOpts = Object.assign({n: 30, secs: DATA.map(s => s.id), shuf: false, shufOpt: true}, store.get('homeOpts', {}));

function secStats(sec){
  let ok = 0, bad = 0;
  sec.questions.forEach(q => { const s = stats[q.id]; if (s) s.last ? ok++ : bad++; });
  return {ok, bad, total: sec.questions.length};
}

function renderHome(){
  session = null; search = null;
  const wrongIds = ALL.filter(q => stats[q.id] && !stats[q.id].last).map(q => q.id);
  const done = ALL.filter(q => stats[q.id]).length;
  app.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><div class="muted">Thư viện</div><div class="big">${ALL.length} câu</div>
        <div class="muted">Đã làm ${done} · Đang sai ${wrongIds.length}</div></div>
        <div class="row">
          <button class="btn" id="wrongBtn" ${wrongIds.length ? '' : 'disabled'}>Ôn lại câu sai (${wrongIds.length})</button>
          <button class="btn" id="resetBtn">Xoá tiến độ</button>
        </div>
      </div>
    </div>

    <h2>Ôn ngẫu nhiên</h2>
    <div class="card">
      <div class="hint" style="margin-top:0">Chủ đề lấy câu:</div>
      <div class="row chips" id="secChips">${DATA.map(s => `<button class="btn ${homeOpts.secs.includes(s.id) ? 'on' : ''}" data-s="${s.id}">${esc(s.title)}</button>`).join('')}</div>
      <div class="hint">Số câu:</div>
      <div class="row chips" id="nChips">${[10,20,30,50,100,0].map(n => `<button class="btn ${homeOpts.n === n ? 'on' : ''}" data-n="${n}">${n || 'Tất cả'}</button>`).join('')}</div>
      <div style="margin-top:16px"><button class="btn primary" id="rndBtn">Bắt đầu ôn ngẫu nhiên →</button></div>
    </div>

    <h2>Ôn từng phần</h2>
    <div class="row" style="margin-bottom:10px;gap:18px">
      <label class="chk"><input type="checkbox" id="shufChk" ${homeOpts.shuf ? 'checked' : ''}> Xáo trộn thứ tự câu</label>
      <label class="chk"><input type="checkbox" id="shufOptChk" ${homeOpts.shufOpt ? 'checked' : ''}> Đảo thứ tự đáp án</label>
    </div>
    <div class="grid">${DATA.map((s, i) => { const st = secStats(s); return `
      <button class="card sec" data-sec="${s.id}">
        <small>Phần ${i + 1}</small><b>${esc(s.title)}</b>
        <small>${st.total} câu · đúng ${st.ok} · sai ${st.bad}</small>
        <div class="bar"><i style="width:${st.ok / st.total * 100}%;background:var(--ok)"></i><i style="width:${st.bad / st.total * 100}%;background:var(--bad)"></i></div>
      </button>`; }).join('')}</div>
    <p class="kbd">Phím tắt khi làm bài: <kbd>A</kbd>–<kbd>H</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / câu tiếp · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>T</kbd> bật/tắt dịch · <kbd>/</kbd> tìm câu hỏi</p>`;

  const saveOpts = () => store.set('homeOpts', homeOpts);
  $('#secChips').onclick = e => { const s = e.target.dataset.s; if (!s) return;
    homeOpts.secs = homeOpts.secs.includes(s) ? homeOpts.secs.filter(x => x !== s) : [...homeOpts.secs, s];
    e.target.classList.toggle('on'); saveOpts(); };
  $('#nChips').onclick = e => { if (e.target.dataset.n == null) return; homeOpts.n = +e.target.dataset.n; saveOpts();
    [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === e.target)); };
  $('#shufChk').onchange = e => { homeOpts.shuf = e.target.checked; saveOpts(); };
  $('#shufOptChk').onchange = e => { homeOpts.shufOpt = e.target.checked; saveOpts(); };
  $('#rndBtn').onclick = () => {
    const pool = ALL.filter(q => homeOpts.secs.includes(q.sec));
    if (!pool.length) return alert('Hãy chọn ít nhất một chủ đề.');
    const list = shuffle(pool); start(homeOpts.n ? list.slice(0, homeOpts.n) : list, 'Ngẫu nhiên', homeOpts.shufOpt);
  };
  app.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => {
    const s = DATA.find(x => x.id === b.dataset.sec);
    start(homeOpts.shuf ? shuffle(s.questions.map(q => BY_ID[q.id])) : s.questions.map(q => BY_ID[q.id]), s.title, homeOpts.shufOpt);
  });
  $('#wrongBtn').onclick = () => start(shuffle(wrongIds.map(id => BY_ID[id])), 'Câu sai', true);
  $('#resetBtn').onclick = () => { if (confirm('Xoá toàn bộ tiến độ làm bài?')) { stats = {}; saveStats(); renderHome(); } };
}

// ---------- quiz ----------
function start(list, title, shufOpt = false){
  const order = {};
  list.forEach(q => { const keys = q.options.map(o => o.key); order[q.id] = shufOpt && canShuffle(q) ? shuffle(keys) : keys; });
  session = {list, title, i: 0, picks: {}, checked: {}, order, shufOpt};
  renderQ(); scrollTo(0, 0);
}

function stemHTML(q){
  return q.stem.map(b => {
    if (b.img) return `<img src="${esc(b.img)}" alt="exhibit" loading="lazy">`;
    if (b.table) return `<table class="tbl">${b.table.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    const t = b.text;
    if (isCode(t)) return `<pre>${esc(t)}</pre>`;
    return `<p>${esc(t)}${trOn && shouldTr(t) ? '\n' + viSpan(t) : ''}</p>`;
  }).join('');
}

function renderQ(){
  const S = session, q = S.list[S.i], picked = S.picks[q.id] || [], checked = S.checked[q.id];
  const multi = need(q) > 1;
  const ans = q.answer;
  const right = checked && ans.length && ans.length === picked.length && ans.every(k => picked.includes(k));
  const answered = Object.keys(S.checked).length;
  const correct = S.list.filter(x => S.checked[x.id] && isRight(x)).length;

  const order = S.order[q.id];
  const optByKey = Object.fromEntries(q.options.map(o => [o.key, o]));
  const label = k => LETTERS[order.indexOf(k)];
  const ex = EXPLAIN[q.id];
  const exHTML = !checked || !ex ? '' : (() => {
    const body = `<b>💡 Giải thích</b>${fmtEx(ex.e)}${ex.warn ? `<div class="warn">⚠️ ${fmtEx(ex.warn)}</div>` : ''}`;
    return right ? `<details class="exd"><summary>Xem giải thích</summary><div class="explain">${body}</div></details>` : `<div class="explain">${body}</div>`;
  })();

  app.innerHTML = `
    <div class="prog"><i style="width:${(S.i + 1) / S.list.length * 100}%"></i></div>
    <div class="qhead">
      <button class="btn" id="back">← ${search ? 'Kết quả tìm' : 'Trang chủ'}</button>
      <span>${esc(S.title)} · <b>Câu ${S.i + 1}/${S.list.length}</b></span>
      <span class="sp"></span>
      <span>✔ ${correct}/${answered}</span>
    </div>
    <div class="card">
      <div class="muted" style="font-size:13px;margin-bottom:8px">${esc(q.secTitle)} · Question ${esc(q.num)}</div>
      <div class="stem">${stemHTML(q)}</div>
      <div class="hint">${multi ? `Chọn ${need(q)} đáp án` : 'Chọn 1 đáp án'}</div>
      <div class="opts">${order.map((k, idx) => {
        const o = optByKey[k];
        const txt = o.text.trim();
        let cls = '';
        if (checked) { if (ans.includes(o.key)) cls = 'ok'; else if (picked.includes(o.key)) cls = 'bad'; }
        else if (picked.includes(o.key)) cls = 'sel';
        const shortTerm = txt.split(/\s+/).length <= 2; // e.g. "Switch 1", "data plane": keep as technical term
        return `<button class="opt ${cls} ${isCode(txt) ? 'code' : ''}" data-k="${o.key}"><span class="k">${LETTERS[idx]}</span><span class="t">${esc(txt)}${shortTerm ? '' : viSpan(txt)}</span></button>`;
      }).join('')}</div>
      ${checked ? `<div class="verdict ${right ? 'ok' : 'bad'}">${right ? '✓ Chính xác!' : '✗ Chưa đúng.'} Đáp án đúng: ${ans.length ? ans.map(label).sort().join(', ') : esc(q.answerText || '?')}
        ${q.explain ? `<div class="ex">${esc(q.explain)}</div>` : ''}</div>${exHTML}` : ''}
      <div class="nav">
        <button class="btn" id="prev" ${S.i ? '' : 'disabled'}>← Trước</button>
        <span class="sp"></span>
        ${checked ? '' : `<button class="btn" id="show">Xem đáp án</button>`}
        ${checked
          ? (S.i < S.list.length - 1 ? `<button class="btn primary" id="next">Câu tiếp →</button>` : `<button class="btn primary" id="finish">Xem kết quả</button>`)
          : `<button class="btn primary" id="check" ${picked.length ? '' : 'disabled'}>Kiểm tra</button>`}
      </div>
    </div>
    <div class="dots">${S.list.map((x, i) => {
      const c = S.checked[x.id] ? (isRight(x) ? 'ok' : 'bad') : '';
      return `<button class="${c} ${i === S.i ? 'cur' : ''}" data-i="${i}">${i + 1}</button>`; }).join('')}</div>`;

  fillTranslations(app);
  $('#back').onclick = () => search ? renderSearch() : renderHome();
  $('#prev').onclick = () => go(-1);
  const n = $('#next'); if (n) n.onclick = () => go(1);
  const f = $('#finish'); if (f) f.onclick = renderResult;
  const c = $('#check'); if (c) c.onclick = check;
  const sh = $('#show'); if (sh) sh.onclick = () => { S.picks[q.id] = S.picks[q.id] || []; check(true); };
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b.dataset.k));
  app.querySelectorAll('.dots button').forEach(b => b.onclick = () => { S.i = +b.dataset.i; renderQ(); });
}

function isRight(q){
  const p = session.picks[q.id] || [];
  return q.answer.length && q.answer.length === p.length && q.answer.every(k => p.includes(k));
}
function pick(k){
  const S = session, q = S.list[S.i];
  if (S.checked[q.id]) return;
  let p = S.picks[q.id] || [];
  if (need(q) > 1) { p = p.includes(k) ? p.filter(x => x !== k) : [...p, k]; if (p.length > need(q)) p = p.slice(1); }
  else p = [k];
  S.picks[q.id] = p;
  // auto-check single-answer questions for speed
  if (need(q) === 1) check(); else renderQ();
}
function check(){
  const S = session, q = S.list[S.i];
  S.checked[q.id] = true;
  const r = isRight(q);
  const st = stats[q.id] || {c: 0, w: 0};
  r ? st.c++ : st.w++; st.last = r ? 1 : 0;
  stats[q.id] = st; saveStats();
  renderQ();
}
function go(d){
  const S = session; const j = S.i + d;
  if (j < 0 || j >= S.list.length) return;
  S.i = j; renderQ(); scrollTo(0, 0);
}
function renderResult(){
  const S = session;
  const ok = S.list.filter(q => S.checked[q.id] && isRight(q)).length;
  const wrong = S.list.filter(q => S.checked[q.id] && !isRight(q));
  const pct = Math.round(ok / S.list.length * 100);
  app.innerHTML = `<div class="card" style="text-align:center">
    <div class="muted">${esc(S.title)} — Kết quả</div>
    <div class="big" style="color:${pct >= 82 ? 'var(--ok)' : 'var(--bad)'}">${ok}/${S.list.length} · ${pct}%</div>
    <div class="muted">${pct >= 82 ? 'Tốt lắm — đạt mức điểm đỗ tham khảo (~82%).' : 'Chưa đạt mức tham khảo ~82%, ôn lại các câu sai nhé.'}</div>
    <div class="row" style="justify-content:center;margin-top:16px">
      ${wrong.length ? `<button class="btn primary" id="redo">Làm lại ${wrong.length} câu sai</button>` : ''}
      <button class="btn" id="again">Làm lại từ đầu</button>
      <button class="btn" id="homeB">Trang chủ</button>
    </div></div>`;
  const r = $('#redo'); if (r) r.onclick = () => start(shuffle(wrong), S.title + ' · câu sai', true);
  $('#again').onclick = () => start(S.list, S.title, S.shufOpt);
  $('#homeB').onclick = renderHome;
  if (search) { $('#homeB').textContent = 'Kết quả tìm'; $('#homeB').onclick = renderSearch; }
}

// ---------- search ----------
let search = null;   // {q, limit} while the search view (or a quiz opened from it) is active
const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/\s+/g, ' ');
const SEARCH_IDX = ALL.map(q => ({
  q,
  own: norm(q.stem.map(b => b.text || (b.table ? b.table.flat().join(' ') : '')).join(' ') + ' ' + q.options.map(o => o.text).join(' ')),
  ex: norm((EXPLAIN[q.id] || {}).e || '')
}));
const isNumQuery = raw => /^\s*(question|cau|câu)?\s*\d+\.\d+\s*$/i.test(raw);

function runSearch(raw){
  if (!raw.trim()) return [];
  if (isNumQuery(raw)) { const n = raw.match(/\d+\.\d+/)[0]; return ALL.filter(q => q.num === n); }
  const terms = norm(raw.trim()).split(' ').filter(Boolean);
  const own = [], viaEx = [];
  for (const it of SEARCH_IDX) {
    if (terms.every(t => it.own.includes(t))) own.push(it.q);                              // in question/options
    else if (terms.every(t => it.own.includes(t) || it.ex.includes(t))) viaEx.push(it.q); // needs the explanation
  }
  return own.concat(viaEx);
}

// Highlight search terms in already-escaped HTML, touching text only (never inside tags).
function hl(html, terms){
  if (!terms.length) return html;
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return html.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : part.replace(re, '<mark>$1</mark>')).join('');
}

function renderSearch(){
  session = null;
  search = search || {q: '', limit: 30};
  app.innerHTML = `
    <div class="qhead"><button class="btn" id="back">← Trang chủ</button><span>Tìm câu hỏi</span></div>
    <input class="sbox" id="sq" type="search" placeholder="Từ khoá (vd: root bridge, ip nat inside) hoặc số câu (vd: 5.23)" value="${esc(search.q)}" autocomplete="off">
    <div id="results"></div>`;
  $('#back').onclick = renderHome;
  const box = $('#sq');
  let t;
  box.oninput = () => { clearTimeout(t); t = setTimeout(() => { search.q = box.value; search.limit = 30; renderResults(); }, 150); };
  box.focus(); box.setSelectionRange(box.value.length, box.value.length);
  renderResults();
}

function renderResults(){
  const el = $('#results'); if (!el) return;
  const raw = search.q;
  if (!raw.trim()) { el.innerHTML = `<p class="muted" style="margin-top:14px">Tìm theo nội dung câu hỏi, đáp án hoặc lời giải. Nhiều từ thì tìm câu chứa đủ tất cả các từ. Gõ số câu như <b>8.45</b> để tìm theo số.</p>`; return; }
  const hits = runSearch(raw);
  if (!hits.length) { el.innerHTML = `<p class="muted" style="margin-top:14px">Không tìm thấy câu nào.</p>`; return; }
  const terms = isNumQuery(raw) ? [] : raw.trim().split(/\s+/).filter(x => x.length > 1);
  el.innerHTML = `<p class="muted" style="margin-top:14px">Tìm thấy ${hits.length} câu${hits.length > search.limit ? `, đang hiện ${search.limit}` : ''}.</p>` +
    hits.slice(0, search.limit).map(q => {
      const ex = EXPLAIN[q.id];
      return `<div class="card res">
        <div class="muted" style="font-size:13px;margin-bottom:8px">${esc(q.secTitle)} · Question ${esc(q.num)}</div>
        <div class="stem">${hl(stemHTML(q), terms)}</div>
        <div class="opts">${q.options.map(o => {
          const txt = o.text.trim();
          const shortTerm = txt.split(/\s+/).length <= 2;
          return `<div class="opt ${q.answer.includes(o.key) ? 'ok' : ''} ${isCode(txt) ? 'code' : ''}"><span class="k">${o.key}</span><span class="t">${hl(esc(txt), terms)}${shortTerm ? '' : viSpan(txt)}</span></div>`;
        }).join('')}</div>
        <div class="ans">✓ Đáp án: ${q.answer.length ? q.answer.join(', ') : esc(q.answerText || '?')}</div>
        ${ex ? `<div class="explain"><b>💡 Giải thích</b>${fmtEx(ex.e)}</div>` : ''}
        <div class="nav"><span class="sp"></span><button class="btn" data-try="${q.id}">Làm thử câu này →</button></div>
      </div>`;
    }).join('') +
    (hits.length > search.limit ? `<div style="text-align:center;margin-top:14px"><button class="btn" id="more">Hiện thêm</button></div>` : '');
  fillTranslations(el);
  const m = $('#more'); if (m) m.onclick = () => { search.limit += 30; renderResults(); };
  el.querySelectorAll('[data-try]').forEach(b => b.onclick = () => { start([BY_ID[b.dataset.try]], 'Làm thử', homeOpts.shufOpt); });
}
$('#searchBtn').onclick = renderSearch;

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'INPUT') return;
  if (e.key === 't' || e.key === 'T') { $('#trBtn').click(); return; }
  if (e.key === '/') { e.preventDefault(); renderSearch(); return; }
  if (!session || !app.querySelector('.opts')) return;
  const q = session.list[session.i];
  const k = e.key.toUpperCase();
  const pos = LETTERS.indexOf(k), order = session.order[q.id];
  if (/^[A-H]$/.test(k) && pos < order.length) pick(order[pos]);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Enter') { e.preventDefault(); (($('#check:not([disabled])')) || $('#next') || $('#finish') || {click(){}}).click(); }
});
$('#home').onclick = renderHome;
renderHome();
})();
</script>
</body>
</html>
